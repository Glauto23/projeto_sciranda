[Modbus_Bus]
Bus_Type = "TCP"                      
; "RTU" (RS-232/485) or "TCP" (Ethernet)
COM_Port = "COM3"
Baud_Rate = 9600                      
; Match WEG SCA06 P00652 (1 = 9600 bps)
Parity = "Even"                       
; "None", "Even", or "Odd" (Match P00653)
IP_Address = "localhost"
Port = 502
Unit_ID = 1                           
; Match WEG SCA06 P00650
Timeout_ms = 500

[Motor]
; --- Real-Time Speed & Torque I/O ---
IO_Driver = "DaqNavi"                 
; "DAQNavi" or "Modbus"
Speed_AI_Channel = "USB-4711A,BID#0/ai0"
Torque_AI_Channel = "USB-4711A,BID#0/ai2"
Command_AO_Channel = "USB-4711A,BID#0/ao0"
Speed_AI_Range = Omit
Torque_AI_Range = Omit
Signal_Type = Omit
Command_AO_Range = Omit

; --- Modbus Register Addresses (Used only if IO_Driver = "Modbus") ---
Speed_AI_Reg = 2                      
; WEG P00002 Actual Speed
Torque_AI_Reg = 3                     
; WEG P00003 Motor Current (Iq)
Command_AO_Reg = 121                  
; WEG P00121 Speed Ref (or 119 for Torque Ref)
Is_Signed = TRUE

; --- Servo Drive Configuration & Diagnostics ---
Drive_Model = "WEG_SCA06_Modbus"
Accel_ms_krpm = 200                   
; WEG P00100
Decel_ms_krpm = 200                   
; WEG P00101


; --- Engineering Scaling ---
Speed_In_Gain = 1
Speed_In_Offset = 0.0
Torque_In_Gain = 1
Torque_In_Offset = 0.0

Speed_Out_Gain = 1
Speed_Out_Offset = 0.0
Torque_Out_Gain = 1
Torque_Out_Offset = 0.0

[Elevator]
IO_Driver = "DAQNavi"                        
; "DAQNavi" or "Modbus"
Position_AI_Channel = "USB-4711A,BID#0/ai1"
Position_AO_Channel = "USB-4711A,BID#0/ao1"
Position_AI_Range = Omit
Signal_Type = Omit
Position_AO_Range = Omit

; --- Modbus Register Addresses (Used only if IO_Driver = "Modbus") ---
Position_AI_Reg = 10
Position_AO_Reg = 20
Is_Signed = TRUE

; --- Engineering Scaling ---
Input_Gain = 1.0
Input_Offset = 0.0
Output_Gain = 1.0
Output_Offset = 0.0